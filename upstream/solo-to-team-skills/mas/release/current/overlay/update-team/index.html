<body><header class="strip"><span data-i="brand">一人成阵</span><button id="lang" lang="en">English</button></header>
<main><div class="intro"><p class="kicker" data-i="local">本地配置更新</p><h1 data-i="title">更新我的团队</h1><p data-i="intro">把新版改善带进自己的队伍。原来的岗位名、头像和群籍可以逐项保留。</p></div>
<section aria-labelledby="inputs-title" class="panel"><h2 id="inputs-title" data-i="choose">选择同一支团队的三份配置</h2>
<p class="history-note" data-i="history">本页只比较内容；团队ID相同不能证明三份文件有共同母版。请确认母版来源。</p>
<div class="inputs">
 <div><label for="base" data-i="base">原母版</label><p data-i="baseHint">你最初据以改队伍的版本</p><input type="file" id="base" aria-describedby="base-note" accept=".json,application/json"><small id="base-note" aria-live="polite"></small></div>
 <div><label for="mine" data-i="mine">我的队伍</label><p data-i="mineHint">当前实际想保留的版本</p><input type="file" id="mine" aria-describedby="mine-note" accept=".json,application/json"><small id="mine-note" aria-live="polite"></small></div>
 <div><label for="next" data-i="next">候选新版</label><p data-i="nextHint">你想比较的上游版本</p><input type="file" id="next" aria-describedby="next-note" accept=".json,application/json"><small id="next-note" aria-live="polite"></small></div>
</div>
<div class="actions"><button id="compare" class="main" data-i="compare" disabled>比较三份文件</button><button id="clear" data-i="clear">清空本页</button></div>
</section>
<section id="review" class="panel" hidden aria-labelledby="review-title"><h2 id="review-title" data-i="review">逐项决定</h2><p id="overview"></p><div id="decisions"></div><details id="retained"><summary id="retained-title"></summary><div id="unchanged"></div></details></section>
<section class="finish"><div id="status" role="status" aria-live="polite"></div><button id="download" class="main" data-i="download" disabled>下载新的团队配置</button></section>
<footer><p data-i="scope">页面在本地比较，另存新的 JSON。每份最多 32 MiB、200 席及 200 群。宿主账号、权限和运行中的任务需在原平台处理。</p><p data-i="manual">可比对写在岗位职责和群用途中的说明。单独的手册文件及平台私有字段不属于这个配置格式。</p></footer></main>
<script>'use strict';
const TeamDefinition = (() => {
  const format = 'solo-to-team.definition';
  const version = '1.0.0';
  const stages = ['dispatch', 'produce', 'review', 'deliver'];
  const types = ['image/png', 'image/jpeg', 'image/webp'];
  const maxAvatar = 512 * 1024;
  const maxDocument = 32 * 1024 * 1024;
  const maxPixels = 2048;
  const seed = {
    format, version, id: 'my-team', name: '项目交付团队',
    roles: [
      { id: 'lead', name: '首席执行官', responsibility: '接收底稿和变更，确认已定条件，归口派工，将经独审的同版成品交回原处。', avatar: null },
      { id: 'producer', name: '生产官', responsibility: '按锁定条件制作成品，按审核意见定向修订，保留原稿并另存新版。', avatar: null },
      { id: 'reviewer', name: '审核官', responsibility: '独立打开指定版本，据要求核实物，说明通过或须修哪一处。', avatar: null }
    ],
    groups: [{ id: 'delivery', name: '项目交付组', purpose: '同步本项目的版本、进度、交件与审核意见。', members: ['lead', 'producer', 'reviewer'] }],
    workflow: { dispatch: 'lead', produce: 'producer', review: 'reviewer', deliver: 'lead' }
  };
  const initial = () => JSON.parse(JSON.stringify(seed));
  const record = item => typeof item === 'object' && item !== null && !Array.isArray(item);
  const text = value => typeof value === 'string' ? value.trim().normalize('NFC') : '';
  const safeID = id => typeof id === 'string' && /^[a-z][a-z0-9_-]{0,63}$/.test(id);
  const same = (value, keys) => record(value) && Object.keys(value).length === keys.length && keys.every(key => Object.hasOwn(value, key));
  const fail = (lang, zh, en) => { throw Error(lang === 'en' ? en : zh); };
  function inspectRaster(bytes, mime) {
    const die = () => { throw Error('头像数据无效或格式不符 / Invalid image or MIME mismatch'); };
    if (!types.includes(mime) || bytes.length < 12 || bytes.length > maxAvatar) die();
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.length);
    const tag = (index, length) => String.fromCharCode(...bytes.subarray(index, index + length));
    let width = 0, height = 0;
    if (mime === 'image/png') {
      if (bytes.length < 33 || tag(0,8)!=='\x89PNG\r\n\x1a\n' || tag(12,4)!=='IHDR') die();
      width = view.getUint32(16); height = view.getUint32(20);
    } else if (mime === 'image/webp') {
      if (bytes.length < 25 || tag(0,4)!=='RIFF' || tag(8,4)!=='WEBP' || view.getUint32(4,true)+8>bytes.length) die();
      const chunk=tag(12,4);
      if (chunk==='VP8X' && bytes.length>=30) {
        width = 1+bytes[24]+(bytes[25]<<8)+(bytes[26]<<16);
        height = 1+bytes[27]+(bytes[28]<<8)+(bytes[29]<<16);
      } else if (chunk==='VP8L' && bytes[20]===0x2f) {
        const bits=view.getUint32(21,true);
        width=(bits&0x3fff)+1; height=((bits>>>14)&0x3fff)+1;
      } else if (chunk==='VP8 ' && bytes.length>=30 && tag(23,3)==='\x9d\x01\x2a') {
        width=view.getUint16(26,true)&0x3fff; height=view.getUint16(28,true)&0x3fff;
      } else die();
    } else {
      if (bytes[0]!==255 || bytes[1]!==216) die();
      for(let i=2; i+4<=bytes.length;) {
        if(bytes[i++]!==255) die();
        while(bytes[i]===255) ++i;
        const marker=bytes[i++];
        if (marker===0xd9 || marker===0xda || i+2>bytes.length) break;
        if (marker===0x01 || (marker>=0xd0 && marker<=0xd7)) continue;
        const length=view.getUint16(i);
        if (length<2 || i+length>bytes.length) die();
        if ([0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf].includes(marker)) {
          if (length<8) die();
          width=view.getUint16(i+5); height=view.getUint16(i+3);break;
        }
        i+=length;
      }
    }
    if (!width || !height || Math.max(width,height)>maxPixels) throw Error('头像尺寸须为 1–2048 像素 / Each side must be 1–2048 px');
    return {width,height};
  }
  function readAvatar(avatar) {
    if (avatar===null) return;
    if (!same(avatar,['mime','data']) || !types.includes(avatar.mime) || typeof avatar.data!=='string')
      throw Error('仅允许 PNG/JPEG/WebP 头像 / Only PNG, JPEG and WebP avatars are accepted');
    const prefix='data:'+avatar.mime+';base64,';
    if (!avatar.data.startsWith(prefix)) throw Error('头像须以内嵌图片保存 / Embedded image required');
    const body=avatar.data.slice(prefix.length);
    if (!body.length || body.length>4*Math.ceil(maxAvatar/3) || body.length%4 || !/^[A-Za-z0-9+/]*={0,2}$/.test(body))
      throw Error('头像数据超限或无效 / Invalid or oversized avatar');
    const raw=atob(body);
    const bytes=Uint8Array.from(raw, ch=>ch.charCodeAt(0));
    inspectRaster(bytes,avatar.mime);
  }
  function normalize(input,lang='zh') {
    const error=(zh,en)=>fail(lang,zh,en);
    if (!same(input,['format','version','id','name','roles','groups','workflow']) || input.format!==format || input.version!==version)
      error('配置格式、版本或字段不匹配。','Unsupported format, version or fields.');
    function validID(id) {
      if (!safeID(id)) error('标识须为 1–64 位小写字母、数字、下划线或连字符，以字母开头。','IDs must start with a letter and contain 1–64 lowercase letters, digits, underscores or hyphens.');
      return id;
    }
    function label(value,tag) {
      const normalized=text(value);
      if (!normalized) error(tag+'不能为空。',tag+' cannot be empty.');
      return normalized;
    }
    function body(value,tag) {
      if (typeof value !== 'string' || !value.trim()) error(tag+'不能为空。',tag+' cannot be empty.');
      return value;
    }
    function unique(items,idKey,labelKey,tag) {
      const ids=new Set(), names=new Set();
      for (const item of items) {
        const id=item[idKey], name=item[labelKey].toLowerCase();
        if(ids.has(id) || names.has(name)) error(tag+'标识或名称重复：'+item[labelKey], 'Duplicate '+tag+' ID or name: '+item[labelKey]);
        ids.add(id); names.add(name);
      }
      return ids;
    }
    const en=lang==='en';
    if (!Array.isArray(input.roles) || !input.roles.length || !Array.isArray(input.groups)) error('至少需要席位，群组必须是列表。','Provide roles and a groups array.');
    const roles=input.roles.map(r=>{
      if (!same(r,['id','name','responsibility','avatar'])) error('席位字段不完整或有未知字段。','Missing or unknown role fields.');
      readAvatar(r.avatar);
      return {id:validID(r.id),name:label(r.name,en?'Role name':'席位名称'),responsibility:body(r.responsibility,en?'Responsibility':'岗位职责'),avatar:r.avatar===null?null:{mime:r.avatar.mime,data:r.avatar.data}};
    });
    const roleIDs=unique(roles,'id','name',en?'role':'席位');
    const groups=input.groups.map(g=>{
      if (!same(g,['id','name','purpose','members']) || !Array.isArray(g.members) || !g.members.length) error('每个群需要名称、用途和至少一名成员。','Each group needs a name, purpose and at least one member.');
      if(g.members.some(id=>!roleIDs.has(id)) || new Set(g.members).size!==g.members.length)
        error('群成员重复或引用了不存在的席位。','A group has an unknown or duplicate member.');
      return {id:validID(g.id),name:label(g.name,en?'Group name':'群名称'),purpose:body(g.purpose,en?'Group purpose':'群用途'),members:[...g.members]};
    });
    unique(groups,'id','name',en?'group':'群');
    if (!same(input.workflow,stages) || stages.some(k=>!roleIDs.has(input.workflow[k]))) error('四项交接职责必须指向已有席位。','All four workflow owners must identify existing roles.');
    if(input.workflow.produce===input.workflow.review) error('生产和独立审核必须由不同的席位承担。','Production and independent review must have different owners.');
    return {format,version,id:validID(input.id),name:label(input.name,en?'Team name':'团队名称'),roles,groups,workflow:Object.fromEntries(stages.map(k=>[k,input.workflow[k]]))};
  }
  function importDefinition(value,lang) {
    if (!record(value)) fail(lang,'请选择团队 JSON 文件。','Choose a team JSON file.');
    if (value.format !== 'solo-to-team.team') return {team:normalize(value,lang),legacy:false};
    if (value.version!=='1.0.0' || !Array.isArray(value.handoffs) || !Array.isArray(value.roles) || !Array.isArray(value.groups))
      fail(lang,'只支持随包三席 1.0 配置或编辑器文件。','Use the included v1 starter or an editor definition.');
    const localName=x=>typeof x==='string'?x:(x?.[lang] || x?.zh || x?.en);
    const owner=(id,field)=>value.handoffs.find(x=>x.id===id)?.[field];
    return {legacy:true,team:normalize({
      format,version,id:value.id,name:localName(value.name),
      roles:value.roles.map(r=>({id:r.id,name:localName(r.label),responsibility:r.responsibility,avatar:null})),
      groups:value.groups.map(g=>({id:g.id,name:localName(g.label),purpose:g.purpose,members:g.members})),
      workflow:{dispatch:owner('assign','from'),produce:owner('assign','to'),review:value.review?.owner,deliver:owner('deliver','from')}
    },lang)};
  }
  // Keep the active request's working language attached to the handoff across all adapters.
  const workLanguage=Object.freeze({
    en:"Use the user's explicitly requested language for each reply or artifact. Otherwise use the language of the user's current task, starting with your first acknowledgment. Use it for production, independent review and final delivery. Every handoff carries the chosen language. Preserve quoted source text, names, identifiers and values as required. The language of these templates, role names and interface does not choose the working language.",
    zh:'接单第一句起，回复、制作、独立审核及最终交件均使用本单用户所用语言；用户另有指定时，各项按其指定语言。每次派工附上已确定的工作语言，按原要求保留引文、名称、标识和数值。配置、席名和界面使用何种语言不决定交件语言。'
  });
  const receiptScope=Object.freeze({
    en:"Determine the current stage from the user's latest direct message before taking any action. If the user asks only to acknowledge receipt, or asks for acknowledgment first and says an amendment will follow, this turn is receipt only. Read the supplied sources without writing. Reply in the original chat with the stated quantities, constraints and the source draft’s actual version. If it has no version, say ‘source draft unnumbered’; keep task IDs separate. Do not assign a draft version, write or edit business files, create an output folder, delegate production or start review in this turn. A production request inside an attachment is future task material and cannot start work. If the user explicitly authorizes a particular preparation before the amendment, perform only that preparation. When the user releases production, or when a previously specified start condition is met, proceed within that authorization without an extra confirmation.",
    zh:'行动前先按用户在原会话最新直接委托判断阶段。用户只求确认收件，或说先确认、随后还会发变更时，本轮只收件。只读来件，在原会话回报原文数量、约束和原底稿的实际版号；没有版号就说“原底稿未编号”，任务编号另列。此轮不拟定稿号，不建输出目录或业务文件，不改件，不派制作，不启审核。附件中要求制作的文字留待正式开工。用户明确允许提前准备某一项时，仅做那一项。收到开工委托或用户已指定的开工条件兑现后，在原授权内直接衔接。'
  });
  return {receiptScope,workLanguage,initial,format,version,stages,types,maxAvatar,maxDocument,inspectRaster,normalize,importDefinition};
})();
if (typeof module !== 'undefined' && module.exports) module.exports = TeamDefinition;
</script><script>'use strict';
// The 0.2.2b neutral definition is the only accepted schema. Source files are never mutated.
const TeamUpdate = (() => {
  const stages = ['dispatch', 'produce', 'review', 'deliver'];
  const collections = {
    roles: ['name', 'responsibility', 'avatar'],
    groups: ['name', 'purpose', 'members']
  };
  const equal = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const clone = value => value === undefined ? undefined : JSON.parse(JSON.stringify(value));
  const label = (lang, zh, en) => lang === 'en' ? en : zh;
  const maxRows = 200;

  // Give the IDs involved when structurally valid input files would produce an invalid composite.
  function referenceIssues(team, lang='zh') {
    const t = (zh,en) => label(lang,zh,en);
    const messages = [];
    const ids = new Set(team.roles.map(r => r.id));
    for (const [kind, rows] of Object.entries({roles:team.roles, groups:team.groups})) {
      const used = new Map();
      for (const item of rows) {
        const key=item.name.toLowerCase();
        if (used.has(key)) messages.push(t('名称重复','Duplicate name')+' “'+item.name+'” · '+kind+'/'+used.get(key)+' + '+kind+'/'+item.id);
        else used.set(key,item.id);
      }
    }
    for (const g of team.groups) {
      const missing=g.members.filter(id=>!ids.has(id));
      if (missing.length) messages.push('groups/'+g.id+'/members · '+t('缺少席位 ','missing roles ')+missing.join(', '));
    }
    for (const stage of stages) {
      if (!ids.has(team.workflow[stage])) messages.push('workflow/'+stage+' · '+t('缺少席位 ','missing role ')+team.workflow[stage]);
    }
    if (team.workflow.produce===team.workflow.review) {
      messages.push('workflow/produce + workflow/review · '+t('制作与独审指向同一席位 ','production and independent review have the same owner ')+team.workflow.produce);
    }
    return messages;
  }

  function read(raw,lang='zh') {
    // Reject unsupported metadata (permissions, model assignments, external handbook fields, etc.) through the same parser.
    if (Array.isArray(raw?.roles) && raw.roles.length>maxRows || Array.isArray(raw?.groups) && raw.groups.length>maxRows) {
      throw Error(label(lang,'每份配置限 200 席、200 群。','Each configuration supports up to 200 roles and 200 groups.'));
    }
    try { return TeamDefinition.normalize(raw,lang); }
    catch (err) {
      // Add concrete IDs where the source shape is sufficiently clear, without accepting invalid data.
      if (Array.isArray(raw?.roles)&&Array.isArray(raw?.groups)&&raw.workflow &&
          raw.roles.every(r=>typeof r?.id==='string'&&typeof r?.name==='string') &&
          raw.groups.every(g=>typeof g?.id==='string'&&typeof g?.name==='string'&&Array.isArray(g?.members)) &&
          stages.every(k=>typeof raw.workflow[k]==='string')) {
        const detail=referenceIssues(raw,lang);
        if (detail.length) throw Error(err.message+'\n'+detail.join('\n'));
      }
      throw err;
    }
  }

  function compare(baseInput,mineInput,nextInput,lang='zh') {
    const [base,mine,next]=[baseInput,mineInput,nextInput].map(x=>read(x,lang));
    if (base.id!==mine.id || base.id!==next.id) throw Error(label(lang,
      '三份 team ID 不一致，无法判断它们是同一支队伍。','The three team IDs differ; they do not identify the same team.')+
      ' '+[base.id,mine.id,next.id].join(' / '));
    const rows=[];
    function field(parts,a,b,c) {
      if (equal(a,b)&&equal(a,c)) return;
      const state=equal(b,c)?'same':equal(a,c)?'mine':equal(a,b)?'new':'conflict';
      rows.push({key:parts.join('/'),parts,base:a,mine:b,next:c,state,required:state==='new'||state==='conflict'});
    }
    field(['name'],base.name,mine.name,next.name);
    for (const [kind,fields] of Object.entries(collections)) {
      const tables=[base,mine,next].map(d=>new Map(d[kind].map(r=>[r.id,r])));
      const ids=new Set([...tables[0].keys(),...tables[1].keys(),...tables[2].keys()]);
      for (const id of ids) {
        const [a,b,c]=tables.map(tab=>tab.get(id));
        // A new ID independently introduced on both sides cannot safely be merged field by field.
        if (a===undefined||b===undefined||c===undefined) field([kind,id],a,b,c);
        else for (const name of fields) field([kind,id,name],a[name],b[name],c[name]);
      }
      // Compare ordering only among entities present in all three files. The owner decides
      // which ordering to use; local-only rows keep their slots and accepted new rows append.
      const shared=new Set([...ids].filter(id=>tables.every(tab=>tab.has(id))));
      const orders=[base,mine,next].map(d=>d[kind].map(r=>r.id).filter(id=>shared.has(id)));
      field([kind,'@order'],...orders);
    }
    for (const k of stages) field(['workflow',k],base.workflow[k],mine.workflow[k],next.workflow[k]);
    return {base,mine,next,rows};
  }

  function resolve(plan,choices,lang='zh') {
    const pending=plan.rows.filter(r=>r.required&&!['mine','next'].includes(choices.get(r.key)));
    if (pending.length) return {pending:pending.map(r=>r.key),issues:[],team:null};
    const out=clone(plan.mine), tables={roles:new Map(out.roles.map(r=>[r.id,r])),groups:new Map(out.groups.map(g=>[g.id,g]))};
    const ordering={};
    for (const row of plan.rows) {
      if (!row.required||choices.get(row.key)!=='next') continue;
      const [kind,id,slot]=row.parts, value=clone(row.next);
      if (kind==='name') out.name=value;
      else if (kind==='workflow') out.workflow[id]=value;
      else if (id==='@order') ordering[kind]=value;
      else if (slot) tables[kind].get(id)[slot]=value;
      else if (value===undefined) tables[kind].delete(id);
      else tables[kind].set(id,value);
    }
    for (const kind of Object.keys(collections)) {
      const table=tables[kind], had=new Set(plan.mine[kind].map(r=>r.id));
      let ids=plan.mine[kind].map(r=>r.id).filter(id=>table.has(id));
      if (ordering[kind]) {
        const members=new Set(ordering[kind]);const sorted=ordering[kind].filter(id=>table.has(id));let i=0;
        ids=ids.map(id=>members.has(id)?sorted[i++]:id);
      }
      ids.push(...plan.next[kind].map(r=>r.id).filter(id=>table.has(id)&&!had.has(id)));
      out[kind]=ids.map(id=>table.get(id));
    }
    const issues=referenceIssues(out,lang);
    if (issues.length) return {pending:[],issues,team:null};
    try {
      const team=read(out,lang);
      const bytes=new TextEncoder().encode(JSON.stringify(team,null,2)+'\n');
      if(bytes.length>TeamDefinition.maxDocument)throw Error(label(lang,'结果超过编队台 32 MiB 的配置上限。','The result exceeds the builder’s 32 MiB configuration limit.'));
      return {pending:[],issues:[],team};
    } catch(e) { return {pending:[],issues:[e.message],team:null}; }
  }
  return {read,compare,resolve};
})();
</script><script>'use strict';
(()=>{
  const $=key=>document.getElementById(key), node=(tag,value)=>{const e=document.createElement(tag);if(value!==undefined)e.textContent=value;return e;};
  const slots=['base','mine','next'];
  let en=location.hash==='#en';
  const lang=()=>en?'en':'zh', t=(zh,eg)=>en?eg:zh;
  const labels={
    brand:['一人成阵','Solo to Team'],local:['本地配置更新','Local configuration update'],title:['更新我的团队','Update my team'],
    intro:['把新版改善带进自己的队伍。原来的岗位名、头像和群籍可以逐项保留。','Bring upstream improvements into your team while keeping your role names, portraits and group membership.'],
    choose:['选择同一支团队的三份配置','Choose three definitions of the same team'],
    history:['本页只比较内容；团队ID相同不能证明三份文件有共同母版。请确认母版来源。','This page compares content. Matching team IDs do not verify a shared history. Check the original base yourself.'],
    base:['原母版','Original base'],mine:['我的队伍','My team'],next:['候选新版','Upstream candidate'],
    baseHint:['你最初据以改队伍的版本','The version you originally customized'],
    mineHint:['当前实际想保留的版本','Your current customized version'],
    nextHint:['你想比较的上游版本','The upstream version you want to compare'],
    compare:['比较三份文件','Compare files'],clear:['清空本页','Clear page'],review:['逐项决定','Review the changes'],
    download:['下载新的团队配置','Download updated team file'],
    scope:['页面在本地比较，另存新的 JSON。每份最多 32 MiB、200 席及 200 群。宿主账号、权限和运行中的任务需在原平台处理。','Compare locally and download a new JSON file. Limit per input: 32 MiB, 200 roles and 200 groups. Account permissions and running tasks are handled in your host.'],
    manual:['可比对写在岗位职责和群用途中的说明。单独的手册文件及平台私有字段不属于这个配置格式。','Role responsibilities and group descriptions can be compared. Separate handbooks and host-specific settings are outside this definition format.'],
    name:['名称','Name'],responsibility:['岗位职责','Responsibility'],avatar:['头像','Portrait'],purpose:['群用途','Group purpose'],members:['群成员','Group membership'],
    dispatch:['派工','Dispatch'],produce:['制作','Production'],reviewStage:['独立审核','Independent review'],deliver:['交回','Final return'],
    order:['共有对象的排列','Order of shared items'],groups:['群','Group'],roles:['岗位','Role']
  };
  const tr=key=>labels[key][en?1:0];
  const data=new Map(),loadErrors=new Map(),loadSeq=new Map(),choices=new Map(),images=new Map();
  let plan=null,revision=0;
  function message(s='',fault=false){$('status').textContent=s;$('status').dataset.fault=String(fault);}
  function slotNotes(){
    for(const k of slots){
      const d=data.get(k),fault=loadErrors.get(k),note=$(k+'-note');
      note.textContent=fault?fault.filename+' · '+t('无法载入：','Could not load: ')+fault.reason:d?d.filename+' · '+d.team.id+' · '+d.team.roles.length+t(' 席',' roles'):t('尚未选取','No file selected');
      note.dataset.fault=String(Boolean(fault));
      if(fault)$(k).setAttribute('aria-invalid','true');else $(k).removeAttribute('aria-invalid');
    }
    $('compare').disabled=slots.some(k=>!data.has(k));
  }
  function forgetComparison(){
    revision++;plan=null;choices.clear();images.clear();$('review').hidden=true;
    $('decisions').replaceChildren();$('unchanged').replaceChildren();$('download').disabled=true;message();
  }
  async function load(k,file){
    if(!file)return;const token=(loadSeq.get(k)||0)+1;loadSeq.set(k,token);
    data.delete(k);loadErrors.delete(k);forgetComparison();slotNotes();
    try{
      if(!file.size||file.size>TeamDefinition.maxDocument)throw Error(t('请选择 0–32 MiB 之间的非空团队 JSON。','Choose a nonempty JSON file of at most 32 MiB.'));
      const team=TeamUpdate.read(JSON.parse(await file.text()),lang());
      if(loadSeq.get(k)!==token)return;
      data.set(k,{filename:file.name,team});slotNotes();
    }catch(err){if(loadSeq.get(k)===token){loadErrors.set(k,{filename:file.name,reason:err.message});slotNotes();message(tr(k)+' · '+err.message,true);}}
  }
  async function avatarDigest(dataURL) {
    if(!images.has(dataURL)){
      const bytes=Uint8Array.from(atob(dataURL.split(',')[1]),c=>c.charCodeAt(0));
      images.set(dataURL,crypto.subtle.digest('SHA-256',bytes).then(out=>Array.from(new Uint8Array(out).subarray(0,6),b=>b.toString(16).padStart(2,'0')).join('')));
    }
    return images.get(dataURL);
  }
  function portrait(box,avatar){
    if(!avatar){box.append(node('p',t('未设头像','No portrait')));return;}
    const img=node('img');img.src=avatar.data;img.alt=t('该版本头像','Portrait for this version');img.loading='lazy';
    const note=node('small',avatar.mime);box.append(img,note);
    avatarDigest(avatar.data).then(hash=>{note.textContent=avatar.mime+' · SHA '+hash;}).catch(()=>{note.textContent=avatar.mime;});
  }
  function value(box,row,v){
    if(v===undefined){box.append(node('p',t('此版本没有该项','Absent from this version')));return;}
    const [kind,id,field]=row.parts;
    if(field==='avatar'){portrait(box,v);return;}
    if(v===null){box.append(node('p','—'));return;}
    if(Array.isArray(v)){box.append(node('p',v.join(' · ')));return;}
    if(typeof v==='object'){
      box.append(node('p',v.name),node('p',kind==='roles'?v.responsibility:v.purpose));
      if(kind==='roles')portrait(box,v.avatar);
      else box.append(node('small',tr('members')),node('p',v.members.join(' · ')));
      return;
    }
    box.append(node('p',String(v)));
  }
  function title(r){
    const [ns,id,field]=r.parts;
    if(ns==='name')return t('团队名称','Team name');
    if(ns==='workflow')return tr(id==='review'?'reviewStage':id);
    if(id==='@order')return tr(ns)+' · '+tr('order');
    const name=(plan.mine[ns].find(x=>x.id===id)||plan.next[ns].find(x=>x.id===id)||plan.base[ns].find(x=>x.id===id))?.name||id;
    return tr(ns)+' · '+name+(field?' · '+tr(field):'');
  }
  function meaning(r){
    if(r.state==='mine')return t('只有你改过，保留你的版本。','Only your version changed. Your edit is retained.');
    if(r.state==='same')return t('你与新版的改动一致。','Your version and the candidate agree.');
    if(r.state==='conflict')return t('双方作了不同的修改，请决定保留哪一侧。','Both sides made different changes. Choose the value to retain.');
    if(r.parts.length===2&&['groups','roles'].includes(r.parts[0])&&r.parts[1]!=='@order'){
      if(r.next===undefined)return t('新版删除了该项。采纳后将从新文件中移除。','The candidate removes this item. Accepting it drops it from the new file.');
      if(r.base===undefined)return t('新版新增该项。由你决定是否纳入。','The candidate adds this item. Choose whether to include it.');
    }
    if(r.parts[0]==='workflow'||r.parts[2]==='members')return t('新版调整人员衔接或群籍，须由你逐项确认。','The candidate changes a handoff or group membership. Explicit approval is required.');
    return t('新版有改动，请选择是否采用。','The upstream candidate changed this field. Choose whether to adopt it.');
  }
  function updateResult(){
    if(!plan)return;const result=TeamUpdate.resolve(plan,choices,lang());
    $('download').disabled=!result.team;
    if(result.pending.length){message(t('还有 ','')+result.pending.length+t(' 项需要你选择。',' choices remain.'));return;}
    if(result.issues.length){message(result.issues.join('\n')+'\n'+t('请调整上述选择，或修改来源配置后重新打开。原文件均保留。','Adjust the choices above or edit and reopen a source file. All originals are preserved.'),true);return;}
    message(t('已通过同版编队台格式与交接检查。新文件可以下载。','The result passed the same builder schema and handoff checks. You can download it.'));
  }
  function showRow(row){
    const card=node('article');card.className='field';card.dataset.change=row.key;
    card.append(node('h3',title(row)),node('code',row.key));
    const caption=node('p',meaning(row));caption.className='meaning';card.append(caption);
    const grid=node('div');grid.className='compare-grid';
    for(const k of slots){const box=node('div');box.append(node('small',tr(k)));value(box,row,row[k]);grid.append(box);}card.append(grid);
    if(row.required){
      const wrap=node('label');wrap.className='select-wrap';wrap.append(node('span',t('本项决定','Decision')));
      const select=node('select');select.dataset.choice=row.key;select.setAttribute('aria-label',title(row)+' · '+row.key);
      for(const [id,word] of [['',t('请选择','Choose')],['mine',t('保留我的','Keep mine')],['next',t('采用候选新版','Use upstream candidate')]]){
        const op=node('option',word);op.value=id;select.append(op);
      }
      select.value=choices.get(row.key)||'';
      select.onchange=()=>{revision++;if(select.value)choices.set(row.key,select.value);else choices.delete(row.key);updateResult();};
      wrap.append(select);card.append(wrap);
    }
    return card;
  }
  function render(){
    if(!plan)return;
    const req=plan.rows.filter(r=>r.required),retained=plan.rows.filter(r=>!r.required);
    $('review').hidden=false;
    $('overview').textContent=plan.mine.name+' · '+plan.mine.id+' · '+req.length+t(' 项需选择，',' require a decision · ')+retained.length+t(' 项自动保留。',' retained or agreed.');
    $('decisions').replaceChildren(...req.map(showRow));
    $('retained').hidden=!retained.length;$('retained-title').textContent=t('查看本地独有或双方一致的改动','Local-only or matching edits')+' ('+retained.length+')';
    $('unchanged').replaceChildren(...retained.map(showRow));updateResult();
  }
  $('compare').onclick=()=>{
    if(slots.some(k=>!data.has(k)))return;
    forgetComparison();
    try{plan=TeamUpdate.compare(...slots.map(k=>data.get(k).team),lang());render();}
    catch(e){message(e.message,true);}
  };
  $('download').onclick=async()=>{
    if(!plan||$('download').disabled)return;
    const version=revision,res=TeamUpdate.resolve(plan,choices,lang());if(!res.team){updateResult();return;}
    try{
      const bytes=new TextEncoder().encode(JSON.stringify(res.team,null,2)+'\n'),buffer=await crypto.subtle.digest('SHA-256',bytes);
      if(version!==revision||!plan)return;
      const digest=Array.from(new Uint8Array(buffer).subarray(0,12),v=>v.toString(16).padStart(2,'0')).join('');
      const a=node('a'),url=URL.createObjectURL(new Blob([bytes],{type:'application/json'}));
      a.href=url;a.download=res.team.id+'-updated-'+digest+'.team.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
      message(t('已交给浏览器下载。可在原编队台点“打开配置”查看；宿主内团队没有被改动。','Download requested. Use Open a file in the existing builder to view it. No host-team changes were made.'));
    }catch(e){if(version===revision)message(e.message,true);}
  };
  function translate(){
    en=location.hash==='#en';document.documentElement.lang=lang()==='en'?'en':'zh-CN';document.title=tr('title')+' · '+tr('brand');
    for(const e of document.querySelectorAll('[data-i]'))e.textContent=tr(e.dataset.i);
    $('lang').textContent=t('English','中文');$('lang').lang=t('en','zh-CN');slotNotes();if(plan)render();
    else if(!$('status').textContent)message(t('三份配置到齐后可比较。','Choose all three definitions to compare.'));
  }
  for(const k of slots)$(k).onchange=e=>{const f=e.target.files[0];e.target.value='';load(k,f);};
  $('lang').onclick=()=>{location.hash=en?'zh':'en';};window.addEventListener('hashchange',translate);
  $('clear').onclick=()=>{for(const k of slots){loadSeq.set(k,(loadSeq.get(k)||0)+1);$(k).value='';}data.clear();loadErrors.clear();forgetComparison();slotNotes();message(t('已清空本次比较。','Comparison cleared.'));};
  translate();
})();
</script></body></html>
